name: CI/CD Pipeline

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]  

env:
  DOTNET_VERSION: '9.0.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore HumanResource/src/Web.API/Web.API.csproj

      - name: Build
        run: dotnet build HumanResource/src/Web.API/Web.API.csproj --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test HumanResource/test/HumanResource.UnitTests/HumanResource.UnitTests.csproj --configuration Release --no-build --verbosity normal

      - name: Run integration tests
        run: dotnet test HumanResource/test/HumanResource.IntegrationTests/HumanResource.IntegrationTests.csproj --configuration Release --no-build --verbosity normal

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run .NET security check
        run: dotnet list HumanResource/src/Web.API/Web.API.csproj package --vulnerable --include-transitive

      # FUTURA IMPLEMENTACION PARA GITHUB DE ORGANIZACION
      # - name: Initialize CodeQL
      #   uses: github/codeql-action/init@v3
      #   with:
      #     languages: csharp

      # - name: Autobuild
      #   uses: github/codeql-action/autobuild@v4

      # - name: Perform CodeQL Analysis
      #   uses: github/codeql-action/analyze@v3

  publish-artifacts:
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Convert repository name to lowercase
        run: echo "LOWERCASE_REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish API
        run: dotnet publish HumanResource/src/Web.API/Web.API.csproj -c Release -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ./publish

      - name: Debug Docker build context
        run: |
          echo "Current directory: $(pwd)"
          echo "Contenido de HumanResource/:"
          ls -la HumanResource/
          echo "Contenido de HumanResource/src/:"
          ls -la HumanResource/src/ || echo "No existe HumanResource/src/"
          echo "Buscando Dockerfile en HumanResource/src/Web.API/:"
          ls -la HumanResource/src/Web.API/ || echo "No existe HumanResource/src/Web.API/"
          echo "Buscando archivos .csproj:"
          find . -name "*.csproj" | sort

      - name: Build Docker image
        run: |
          docker build -f HumanResource/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.LOWERCASE_REPO }}:latest \
            -t ${{ env.REGISTRY }}/${{ env.LOWERCASE_REPO }}:${{ github.sha }} \
            HumanResource

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.LOWERCASE_REPO }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.LOWERCASE_REPO }}:${{ github.sha }}